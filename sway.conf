# Headless sway for the iPad second screen.
# Deliberately minimal: no bar, no wallpaper daemon, no autostart.
# Everything lives under second-screen/ so teardown is one rm -rf.

# The headless backend creates HEADLESS-1. Mode/scale come from the launcher
# via swaymsg after startup, so they stay env-overridable without editing this.
output HEADLESS-1 background #1a1b26 solid_color

# No idle/lock, no cursor hiding: the VNC client owns the pointer.
seat * hide_cursor 0

# Input arrives only from wayvnc's virtual devices.
input type:keyboard {
    xkb_layout us
}

set $mod Mod4
floating_modifier $mod normal

# Enough bindings to be usable from a touchscreen VNC client.
bindsym $mod+Return exec foot || exec alacritty || exec xterm
bindsym $mod+d exec fuzzel
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3

# No exit binding on purpose: the screen is torn down from x570, not the iPad.
